name: eduplas
description: EduPlas uygulaması
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3

  # Konum & cihaz
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  # Güvenli depolama
  flutter_secure_storage: ^9.2.2

  # Dil / L10n
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Yerel depolama
  shared_preferences: ^2.5.3

  # URL açma (sözleşme linkleri için)
  url_launcher: ^6.3.0

  # Diğer
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  intl: 0.19.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/veri/yerler/tr.json
    - assets/hukuk/tr/
    - assets/hukuk/en/
    
